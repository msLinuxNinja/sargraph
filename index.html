      <h1>SarGRAPH — Linux Performance Visualization</h1>
      <p>SarGRAPH is an open-source tool for visualizing sysstat/sar performance data. Upload a <code>sar</code> binary data file to explore interactive charts for CPU utilization, memory usage, I/O throughput, network traffic, block device activity, and paging metrics — all in a dark-themed dashboard.</p>
      <p>Key features: drag-and-drop file upload, per-CPU core analysis, block device timeline, network error tracking, and lsblk device name mapping.</p>
